# Latest Federal single audit per hospital EIN (Federal Audit Clearinghouse).
name: fac
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fac:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/fac_audits.py
        env:
          FAC_API_KEY: ${{ secrets.FAC_API_KEY }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registry/fac_audits.csv
          git commit -m "data: FAC single audits by hospital EIN" || exit 0
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && break; sleep $((i*10)); done
