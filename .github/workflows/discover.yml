# Refresh the CMS registry and crawl cms-hpt.txt for the largest N hospitals.
# Only cms-hpt.txt files are fetched; price files (MRFs) get an HTTP HEAD for
# metadata and are never downloaded.
name: discover
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of largest hospitals to crawl"
        default: "10"
      refresh_cms:
        description: "Re-download CMS Hospital General Information + POS first"
        type: boolean
        default: false
      workers:
        description: "Parallel requests (different sites)"
        default: "32"
      refresh_leads:
        description: "Re-import website leads from Wikidata and OpenStreetMap first"
        type: boolean
        default: false
      find_websites:
        description: "Infer and verify websites for hospitals no source covers"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: discover
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Refresh CMS files
        if: ${{ github.event_name == 'schedule' || inputs.refresh_cms }}
        run: python -m hpthub cms-download
      - name: Refresh Wikidata website leads
        if: ${{ github.event_name == 'schedule' || inputs.refresh_leads }}
        run: python scripts/import_domain_leads.py wikidata
      - name: Refresh OpenStreetMap website leads
        if: ${{ github.event_name == 'schedule' || inputs.refresh_leads }}
        continue-on-error: true
        run: python scripts/import_domain_leads.py osm
      - run: python -m hpthub registry
      - name: Infer and verify websites for hospitals with none
        if: ${{ github.event_name == 'schedule' || inputs.find_websites }}
        continue-on-error: true
        run: python scripts/find_websites.py --workers 64 --minutes 40 && python -m hpthub registry
      - run: python -m hpthub discover --limit "${{ inputs.limit || '100' }}" --workers "${{ inputs.workers || '32' }}"
      - run: python -m hpthub site
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data.json CATALOG.md
          git diff --cached --quiet || git commit -m "data: discovery run $(date -u +%F)"
          git pull --rebase -X theirs origin main && git push
      # Publishing needs Settings > Pages > Source = GitHub Actions; skip quietly until then.
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true
      - name: Add data files to the site
        run: cp -r data site/data && cp CATALOG.md site/ && python3 scripts/dir_index.py site/data
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.pages.outcome == 'success'
