# Read hospital facilities and EINs from IRS Form 990 Schedule H (public e-file XML).
name: irs990
on:
  workflow_dispatch:
    inputs:
      years:
        description: "IRS release years to read, newest first"
        default: "2025 2024"
permissions:
  contents: write
concurrency:
  group: irs990
jobs:
  schedule-h:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests zipfile-deflate64
      - run: python scripts/irs990_schedule_h.py ${{ inputs.years }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registry/irs990_hospital_facilities.csv
          git commit -m "data: IRS 990 Schedule H hospital facilities" || exit 0
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && break; sleep $((i*10)); done
