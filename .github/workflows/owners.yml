# Hospital owners (CMS Hospital All Owners) and the SEC-registered parent company, if any.
name: owners
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  owners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/owners.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registry/hospital_owners.csv data/registry/ccn_npi.csv
          git commit -m "data: hospital owners (CMS) and SEC parents" || exit 0
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && break; sleep $((i*10)); done
