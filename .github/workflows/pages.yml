# Publish the site: the `prod` branch at moqri-lab.org/hospitals/ (stable) and `main` at /dev/.
name: pages
on:
  push:
    branches: [main]
    paths: ["*.html", "data.json", "data/**", "scripts/build_pages.sh"]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Build prod (root) and dev (/dev/)
        run: bash scripts/build_pages.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
