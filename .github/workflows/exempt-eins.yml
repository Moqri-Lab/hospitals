# Mark which hospital EINs are tax-exempt organizations (IRS EO Business Master File), and spot-check ProPublica.
name: exempt-eins
on:
  workflow_dispatch:
    inputs:
      sample:
        description: "EIN digits to spot-check on ProPublica Nonprofit Explorer"
        default: "042312909 610000033 920139171"
permissions:
  contents: write
jobs:
  eins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/exempt_eins.py
      - name: Spot-check ProPublica pages
        run: |
          UA="hpt-hub/0.1 (+https://github.com/Moqri-Lab/hospitals)"
          for e in ${{ inputs.sample }}; do
            for id in "$e" "$((10#$e))"; do
              curl -sS -o page.html -A "$UA" --max-time 60 -w "$id -> %{http_code} %{redirect_url}\n" "https://projects.propublica.org/nonprofits/organizations/$id" || true
              grep -o "<title>[^<]*</title>" page.html | head -1 || true
            done
          done
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registry/exempt_eins.csv
          git commit -m "data: tax-exempt hospital EINs (IRS EO BMF)" || exit 0
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && break; sleep $((i*10)); done
